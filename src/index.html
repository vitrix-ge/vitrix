<!doctype html>
<html lang="ka">
  <head>
    <meta charset="utf-8" />
    <title>VITRIX</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="VITRIX is an institute of emergency medicine, simulation, and human performance. Built for the critical moment."
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <!-- Latin text: Manrope + Montserrat, self-hosted (public/fonts/latin.css) so no visitor data goes
         to Google Fonts. -->
    <link rel="stylesheet" href="fonts/latin.css" />
    <!-- Georgian text: FiraGO (SIL Open Font License, public/fonts/firago/OFL.txt), self-hosted and
         trimmed to Georgian + Latin. Relative URLs resolve against <base href>, so this works on
         GitHub Pages under /vitrix/ too. -->
    <link
      rel="preload"
      href="fonts/firago/firago-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/firago/firago-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: 'FiraGO';
        font-weight: 400;
        font-display: swap;
        src: url('fonts/firago/firago-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'FiraGO';
        font-weight: 500;
        font-display: swap;
        src: url('fonts/firago/firago-500.woff2') format('woff2');
      }
      @font-face {
        font-family: 'FiraGO';
        font-weight: 600;
        font-display: swap;
        src: url('fonts/firago/firago-600.woff2') format('woff2');
      }
      @font-face {
        font-family: 'FiraGO';
        font-weight: 700 900;
        font-display: swap;
        src: url('fonts/firago/firago-700.woff2') format('woff2');
      }
    </style>
    <script>
      // Apply the saved language and theme before the app starts, so the page doesn't flash.
      try {
        var l = localStorage.getItem('vitrix.lang');
        document.documentElement.lang = l === 'en' ? 'en' : 'ka';
        document.documentElement.dataset.theme =
          localStorage.getItem('vitrix.theme') === 'dark' ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>

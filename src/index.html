<!doctype html>
<html lang="ka">
  <head>
    <meta charset="utf-8" />
    <title>VITRIX</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="VITRIX is an institute of emergency medicine, simulation, and human performance. Built for the critical moment."
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved language and theme before the app starts, so the page doesn't flash.
      try {
        var l = localStorage.getItem('vitrix.lang');
        document.documentElement.lang = l === 'en' ? 'en' : 'ka';
        document.documentElement.dataset.theme =
          localStorage.getItem('vitrix.theme') === 'dark' ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>

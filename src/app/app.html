<a class="skip" href="#content">{{ 'Skip to content' | t }}</a>
<app-site-header />
<main id="content">
  <router-outlet />
</main>
<app-site-footer />

<div class="toast-region" role="status" aria-live="polite">
  @if (notify.note(); as note) {
    <div class="toast" [class]="'toast toast-' + note.kind">
      <span>{{ note.text }}</span>
      <button type="button" class="toast-close" (click)="notify.dismiss()">
        <span class="sr-only">{{ 'Dismiss' | t }}</span>
        <span aria-hidden="true">×</span>
      </button>
    </div>
  }
</div>

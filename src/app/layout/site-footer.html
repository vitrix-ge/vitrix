<footer class="site-footer">
  <div class="wrap footer-top">
    <a class="brand" routerLink="/" [attr.aria-label]="'VITRIX home' | t">
      <app-mark />
      <span>VITRIX</span>
    </a>

    <nav [attr.aria-label]="'Footer menu' | t">
      @for (item of nav; track item.path) {
        <a [routerLink]="item.path">{{ item.label | t }}</a>
      }
    </nav>

    <div class="footer-social">
      <a href="https://www.instagram.com" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4" y="4" width="16" height="16" rx="4" />
          <circle cx="12" cy="12" r="3.5" />
          <circle cx="17.2" cy="6.8" r="0.8" fill="currentColor" stroke="none" />
        </svg>
      </a>
      <a href="https://www.linkedin.com" target="_blank" rel="noopener" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4" y="4" width="16" height="16" rx="2" />
          <path d="M8 10.5V16M8 8h.01M12 16v-3.2a1.6 1.6 0 0 1 3.2 0V16M12 13.2V10.5" />
        </svg>
      </a>
      <a href="https://www.youtube.com" target="_blank" rel="noopener" aria-label="YouTube">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="7" width="18" height="10" rx="2" />
          <path d="M11 10.2v3.6l3.2-1.8Z" fill="currentColor" stroke="none" />
        </svg>
      </a>
      <p class="footer-mark">
        {{ 'Built for' | t }}<br />
        {{ 'the critical' | t }}<br />
        {{ 'moment' | t }}
      </p>
    </div>
  </div>

  <div class="wrap footer-bottom">
    <p>
      {{ '© {year} VITRIX. All rights reserved.' | t: { year: year } }}
      <a routerLink="/privacy">{{ 'Privacy' | t }}</a>
    </p>
    <p>
      {{ 'Tbilisi, Georgia' | t }} <span aria-hidden="true">|</span> {{ 'A Global Vision.' | t }}
    </p>
  </div>
</footer>
